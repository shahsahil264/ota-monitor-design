# OTA Component → Project Routing
#
# CYBORG IS PRIMARY. This file contains ONLY overrides for known-bad mappings.
# Everything else comes from Cyborg jira-OCPBUGS-* lookups (official, team-maintained).
#
# Routing algorithm:
#   1. Check overrides below (2 entries — verified cases where Cyborg is wrong/missing)
#   2. OrgData jira-OCPBUGS-* lookup → filter out OCPBUGS/RFE/OCPSTRAT → if 1 result, suggest
#   3. Try parent component (e.g., jira-OCPBUGS-networking if sub-component not found)
#   4. Ask OTA Monitor manually
#   5. Human confirms EVERY time
#
# Query pattern: search OrgData for the OCPBUGS component name directly
#   e.g., "Find the component that maps to OCPBUGS component 'Networking / multus'"
#   Case-insensitive. Fuzzy search handles slug differences.
#
# When to add an override: ONLY when you've verified OrgData returns the wrong answer.
# When to REMOVE an override: when the Cyborg data is fixed (MR merged, OrgData updated).

overrides:
