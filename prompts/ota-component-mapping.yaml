# OTA Component → Jira Project + Slack Mapping
# Source: Historical Spike analysis (50+ UpgradeBlockers) + OrgData verification (Aug 2026)
# Review quarterly — run: type = Spike AND summary ~ "Impact statement request" AND labels = UpgradeBlocker
#
# Routing priority:
#   1. This config file (deterministic, data-driven)
#   2. OrgData jira-OCPBUGS-* lookup → filter out OCPBUGS/RFE → suggest (80% hit rate)
#   3. Try parent component (e.g., jira-OCPBUGS-networking if sub-component not found)
#   4. Ask OTA Monitor manually (last resort)
#   5. Human confirms EVERY time
#
# OrgData API limitations (verified Aug 2026):
#   - types: main field exists in Cyborg configs but NOT exposed through OrgData API
#   - Slack channel types (forum/team_internal) NOT exposed — treat all as postable
#   - Team roles (manager/team_lead UIDs) NOT exposed — escalation is manual
#   - jira-OCPBUGS-* entries cover ~80% of components (up from 20% with bare names)

component_to_project:
  # Networking (all → CORENET) — verified via jira-OCPBUGS-networking-*
  "Networking / openshift-sdn":
    project: "CORENET"
    slack_channel: "#forum-ocp-sdn"
  "Networking / ovn-kubernetes":
    project: "CORENET"
    slack_channel: "#forum-ocp-sdn"
  "Networking / whereabouts":
    project: "CORENET"
    slack_channel: "#forum-ocp-sdn"
  "Networking / ipsec":
    project: "CORENET"
    slack_channel: "#forum-ocp-sdn"
  "Multus":
    project: "CORENET"
    slack_channel: "#forum-ocp-sdn"

  # Machine Config — OVERRIDE: OrgData maps to Node/OCPNODE (incorrect for Spikes)
  "Machine Config Operator":
    project: "MCO"
    slack_channel: "#forum-ocp-mco"
    orgdata_override: true
    note: "OrgData returns Node team → OCPNODE. Historical Spikes go to MCO (e.g., MCO-1896)."

  # Cloud Compute (all → OCPCLOUD) — OVERRIDE: not in Cyborg
  "Cloud Compute / Azure":
    project: "OCPCLOUD"
    slack_channel: "#forum-ocp-cloud"
    orgdata_override: true
    note: "jira-OCPBUGS-cloud-compute-azure not found in Cyborg."
  "Cloud Compute / AWS":
    project: "OCPCLOUD"
    slack_channel: "#forum-ocp-cloud"
  "Cloud Compute / Machine API Providers":
    project: "OCPCLOUD"
    slack_channel: "#forum-ocp-cloud"

  # CoreOS / kernel — verified via jira-OCPBUGS-rhcos
  "RHCOS":
    project: "COS"
    slack_channel: "#dev-coreos"

  # Individual team projects — verified via jira-OCPBUGS-* lookups
  "Monitoring":
    project: "MON"
    slack_channel: "#forum-openshift-monitoring"
    note: "OrgData returns 5 projects (COO,MON,OBSDA,OCPBUGS,RFE). MON is correct for Spikes."
  "Console":
    project: "CONSOLE"
    slack_channel: "#forum-ocp-console"
  "OLM":
    project: "OPRUN"
    slack_channel: "#forum-ocp-operator-fw"
  "Authentication":
    project: "AUTH"
    slack_channel: null
    orgdata_override: true
    note: "jira-OCPBUGS-authentication not found in Cyborg."
  "Image Registry":
    project: "IR"
    slack_channel: null
  "Hosted Control Planes":
    project: "HOSTEDCP"
    slack_channel: null
  "etcd":
    project: "ETCD"
    slack_channel: "#forum-ocp-etcd"
  "SRIOV":
    project: "NHE"
    slack_channel: null
  "Installer":
    project: "CORS"
    slack_channel: "#forum-ocp-installer"

  # Catch-all → OCPNODE
  "Logging":
    project: "OCPNODE"
    slack_channel: null
  "Node":
    project: "OCPNODE"
    slack_channel: "#forum-ocp-node"

# Wildcard rules (apply when exact match fails)
wildcard_rules:
  "Networking / *":
    project: "CORENET"
    slack_channel: "#forum-ocp-sdn"
  "Cloud Compute / *":
    project: "OCPCLOUD"
    slack_channel: "#forum-ocp-cloud"

# OrgData fallback query pattern:
#   1. Convert: "Networking / multus" → "jira-OCPBUGS-networking-multus"
#   2. Search OrgData for that slug
#   3. If found → get team → list projects → filter out OCPBUGS/RFE/OCPSTRAT
#   4. If 1 candidate → suggest. If multiple → present choices.
#   5. If not found → try parent: strip last segment, retry
#   6. If still not found → ask human

# Default when no match found
default: "ASK_HUMAN"
